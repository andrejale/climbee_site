<section class="col-6 col-12-narrower">
    <h3>{{ .header | default "Get In Touch" }}</h3>
    <form name="contact" method="POST" netlify >
        <div class="row gtr-50">
            <div class="col-6 col-12-mobilep">
                <input type="text" name="name" id="name" placeholder="{{ T "contact_name" }}" />
            </div>
            <div class="col-6 col-12-mobilep">
                <input type="email" name="email" id="email" placeholder="{{ T "contact_email" }}" />
            </div>
            <div class="col-12">
                <form class="type">
                    <select id="Pszihológia" name="therapy[]" multiple>
                        <option value="Logopédia">Logopédia</option>
                        <option value="Gyogytorna">Gyógytorna</option>
                        <option value="Pszihológia">Pszihológia</option>
                    </select>
                </form>  
            </div>      
            <div class="col-12">
                <textarea name="message" id="message" placeholder="{{ T "contact_message" }}" rows="5"></textarea>
            </div>
            <div class="col-12">
                <button type="submit">Send</button>
            </div>
        </div>
    </form>
</section>
