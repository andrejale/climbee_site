<section class="col-6 col-12-narrower">
    <h3>{{ .header | default "Get In Touch" }}</h3>
        <p>
            Időpont-egyeztetésért, vagy bármilyen kérdés megválaszolásáért, nyugodtan írjatok nekünk és lépjünk kapcsolatba.
            Igyekszünk mihamarabb válaszolni, illetve visszahívni ha a telefonszámot is beleírjátok.
        </p>
        <form name="contact" method="POST" data-netlify="true">
        <p>
            <label>Név: <input type="text" name="name" /></label>
        </p>
        <p>
            <label>Email: <input type="email" name="email" /></label>
        </p>
        <p>
            <label>Foglalkozás: 
                <select name="role[]">
                    <option value="Logopedia">Logopédia</option>
                    <option value="Gyogytorna">Gyógytorna</option>
                    <option value="Konduktiv">Konduktív</option>
                    <option value="Pszichologia">Pszichológia</option>
                    <option value="Maszas">Mászás</option>
            </select></label>
        </p>
        <p>
            <label>Üzenet: <textarea name="message"></textarea></label>
        </p>
        <p>
            <button type="submit">Küldés</button>
        </p>
        </form>

</section>
