<section id="cta" class="wrapper style3">
    <div class="container">
        <header>
            <h2>{{ .item.contents | markdownify }}</h2>
            {{- with .item.button }}
                <a href="{{ .url }}" class="button">{{ .contents }}</a>
            {{- end }}
        </header>
        {{- with .item.video_url }}
        <style>
            .cta-video-wrap { position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin:2em 40px; }
            @media (max-width:736px) { .cta-video-wrap { margin:2em 0; } }
        </style>
        <div class="cta-video-wrap">
            <iframe src="{{ . }}" style="position:absolute;top:0;left:0;width:100%;height:100%;" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        {{- end }}
    </div>
</section>
