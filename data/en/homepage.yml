items:
  - type: highlights
    items_per_row: 3
    items:
    - title: Korai Támogatás 
      icon: fa-heart
      content: >
        Ez első években a legfogékonyabb az idegrendszer a tanulásra és fejlődésre. Időben megkezdve a megfelelő fejlesztést, játékosan és örömmel erősíthetjük meg azt, amiben igazán jó lehet.
    - title: Képzett Szakemberek
      icon: fa-cat
      content: >
        Csapatunk magas szintű képzettséggel, tapasztalattal rendelkezik. A gyerekekkel való munka naprakész tudáson alapuljon, ezért folyamatosan képezzük magunkat.
    - title: Letisztult Környezet
      icon: fa-seedling
      content: >
        Nyugodt, letisztult tér fogadja a gyerekeket, ahol kevesebb a zavaró inger, mint a mindennapi környezetükben. Ez segít abban, hogy könnyebben tudjanak figyelni, kapcsolódni önmagukhoz és társaikhoz is.
  - type: heading
    heading: Célunk
    contents: Hogy a gyereket előkészítsük hogy könnyebben vegyék majd az elöttuk allo kihívásokat, ügyesebben kapcsolódjanak a társaihoz, és magabiztosabban fedezzek fel a világot. Mind bevalt, mind innovativ technikakat alkalmazva dolgozunk
  - type: posts
    #heading: Recent Posts
    content_type: posts
    max: 4
