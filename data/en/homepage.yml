items:
  - type: highlights
    items_per_row: 3
    items:
    - title: Developmental Wall Climbing
      icon: fa-users
      content: >
        Individual and group developmental sessions where children's development is supported through the experience of wall climbing. Sessions are led by special education teachers and/or physiotherapists.
      url: "/fejleszto-maszas"
    - title: Individual Therapies & Development
      icon: fa-child
      url: "/egyeni-terapiak"
      content: >
        Individually tailored developmental sessions where specialists adapt their work to the specific needs of the child or adult. Services include conductive education, physiotherapy (for babies and adults), Dévény treatment, speech therapy, and child psychology support.
    - title: Foundation
      icon: fa-leaf
      url: "/alapitvany"
      content: >
        The Foundation's mission is to make climbing-wall-based, movement-centred development accessible to as many children as possible — especially children with special educational needs, whose development this playful, movement-based approach can support particularly well.
  - type: heading
    heading: Our Goal
    contents: To prepare children so they can more easily meet the challenges ahead, connect more skillfully with their peers, and explore the world with greater confidence. We work using both proven and innovative techniques.
  - type: posts
    #heading: Recent Posts
    content_type: posts
    max: 4
  - type: cta
    contents: Curious about what a session looks like? Take a peek in the videos and discover the magical world of climbing-wall development.
    video_url: "https://www.youtube.com/embed/VCXHg_IoGLE"
