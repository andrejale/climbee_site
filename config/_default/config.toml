baseURL = "https://www.climbee.fun/"
relativeURLs = "True"
languageCode = "en"
title = "ClimBee Képességfejlesztő Ház"
enableEmoji = true

copyright = "© Untitled. All rights reserved"

[HTTPCache]
  [HTTPCache.cache]
    [HTTPCache.cache.for]
      excludes = ['**']
      includes = []

[deployment]
  confirm = false
  dryRun = false
  force = false
  invalidateCDN = true
  maxDeletes = 256
  target = ''
  workers = 10
  [[deployment.targets]]
    name = 'production'
    url = 's3://climbee.fun?region=eu-north-1'

#  Compress and cache static assets for 1 week.
[[deployment.matchers]]
pattern = "^.+\\.(css|eot|html|ico|js|json|otf|svg|ttf|xml)$"
cacheControl = "max-age=604800, no-transform, public"
gzip = true

#  Cache static assets for 1 week, compression not required.
[[deployment.matchers]]
pattern = "^.+\\.(gif|jpg|jpeg|png|woff|woff2)$"
cacheControl = "max-age=604800, no-transform, public"
gzip = false

[taxonomies]
    tag = "tags"

[params]
    description = "Belvárosi képességfejlesztő ház honlaplja."
    images = ['images/metaimage.jpg']
    show_post_dates = false
    enableSourceMaps = true


    [[params.social]]
        title = "Instagram"
        icon = "fa-instagram"
        url = "https://www.instagram.com/climbeee"
    [[params.social]]
        title = "Facebook"
        icon = "fa-facebook-f"
        url = "https://www.facebook.com/climbeee"
    [[params.social]]
        title = "TikTok"
        icon = "fab fa-tiktok"
        url = "https://www.tiktok.com/@climbeee"
    [[params.social]]
        title = "Youtube"
        icon = "fa-youtube"
        url = "#"
    [[params.social]]
        title = "Creative Commons"
        icon = "fa-creative-commons"
        url = "https://creativecommons.org/"

    [params.footer]

        [[params.footer.links]]
            header = "Egyéb Tartalom"
            footer = "Hol Vagyun"
        [[params.footer.links.links]]
            title = "Tapasztalatok"
            url = "#"
        [[params.footer.links.links]]
            title = "Egyéb"
            url = "#"
        [[params.footer.links.links]]
            title = "Galéria"
            url = "#"

    [params.footer.contact_form]
        enabled = true
        header = "Írj Nekunk"
